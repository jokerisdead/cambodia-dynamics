<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柬埔寨动态 - 国别研究素材库</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --theme-color: #42b983;
    }
    .sidebar {
      background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
    }
    .sidebar-nav > ul > li > a {
      font-weight: bold;
      color: #42b983 !important;
    }
    .sidebar ul li a {
      color: #ecf0f1;
      transition: all 0.3s;
    }
    .sidebar ul li a:hover {
      color: #42b983;
      background: rgba(66, 185, 131, 0.1);
    }
    .sidebar ul li.active > a {
      color: #42b983 !important;
      border-right: 3px solid #42b983;
    }
    .markdown-section h1 {
      color: #2c3e50;
      border-bottom: 3px solid #42b983;
      padding-bottom: 15px;
    }
    .markdown-section h2 {
      color: #34495e;
      border-left: 4px solid #42b983;
      padding-left: 12px;
      margin-top: 30px;
    }
    .markdown-section h3 {
      color: #2c3e50;
      border-bottom: 1px dashed #bdc3c7;
      padding-bottom: 8px;
    }
    /* 密码遮罩层 */
    #password-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a252f 0%, #2c3e50 50%, #3498db 100%);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .password-box {
      background: #fff;
      border-radius: 16px;
      padding: 45px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .password-box h2 {
      margin: 0 0 8px 0;
      color: #2c3e50;
      font-size: 26px;
    }
    .password-box .flag { font-size: 48px; margin-bottom: 15px; }
    .password-box p {
      color: #7f8c8d;
      margin: 0 0 25px 0;
      font-size: 14px;
    }
    .password-box input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .password-box input:focus { border-color: #42b983; }
    .password-box button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      background: #42b983;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .password-box button:hover { background: #3aa876; }
    .password-box .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    /* 搜索框样式 */
    .search-wrap { background: rgba(255,255,255,0.1) !important; }
    .search-wrap input { color: #fff !important; }
    /* 折叠菜单样式 */
    .app-nav { display: none; }
  </style>
</head>
<body>

  <!-- 密码输入遮罩 -->
  <div id="password-overlay">
    <div class="password-box">
      <div class="flag">🇰🇭</div>
      <h2>柬埔寨动态追踪</h2>
      <p>柬埔寨研究中心 · 区域国别研究素材库</p>
      <input type="password" id="password-input" placeholder="请输入访问密码" autofocus>
      <button onclick="checkPassword()">进入网站</button>
      <div class="error-msg" id="error-msg">密码错误，请重试</div>
    </div>
  </div>

  <div id="app" style="display:none;"></div>

  <script>
    const CORRECT_PASSWORD = "zhaowei";

    function checkPassword() {
      var input = document.getElementById('password-input').value;
      if (input === CORRECT_PASSWORD) {
        localStorage.setItem('cambodia_auth', '1');
        document.getElementById('password-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        initDocsify();
      } else {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('password-input').value = '';
        setTimeout(function() {
          document.getElementById('error-msg').style.display = 'none';
        }, 2000);
      }
    }

    document.getElementById('password-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    if (localStorage.getItem('cambodia_auth') === '1') {
      document.getElementById('password-overlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initDocsify();
    }

    function initDocsify() {
      if (window.$docsifyInited) return;
      window.$docsifyInited = true;

      window.$docsify = {
        name: '柬埔寨动态',
        repo: 'jokerisdead/cambodia-dynamics',
        basePath: '/cambodia-dynamics/',
        maxLevel: 4,
        subMaxLevel: 3,
        sidebarDisplayLevel: 2,
        coverpage: true,
        loadSidebar: true,
        auto2top: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: '搜索内容...',
          noData: '未找到结果',
          depth: 3
        },
        pagination: {
          previousText: '上一篇',
          nextText: '下一篇',
        },
        copyCode: {
          buttonText: '复制',
          successText: '已复制'
        },
        timeUpdater: {
          text: '<em>最后更新：{time}</em>',
          formatUpdated: '{YYYY}年{MM}月{DD}日 {HH}:{mm}'
        }
      }

      var scripts = [
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js',
        'https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js'
      ];
      scripts.forEach(function(src) {
        var s = document.createElement('script');
        s.src = src;
        document.body.appendChild(s);
      });
    }
  </script>
</body>
</html>
